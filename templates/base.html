<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}ML Dataset Dashboard{% endblock %}</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- Header -->
<header class="header">
    <h1>ML Dataset Dashboard</h1>
    <p>Dataset: <strong>Iris Dataset</strong></p>
</header>


<!-- Main Layout -->
<div class="layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">

        `<h2>Menu</h2>

        <a href="{{ url_for('load_page') }}"
           class="menu-btn">`
            Load Data
        </a>

        <a href="{{ url_for('eda_page') }}"
           class="menu-btn">
            EDA
        </a>
        <a href="{{ url_for('feature_engg_page') }}"
           class="menu-btn">
            Feature Engg
        </a>
    </aside>


    <!-- Page Content -->
    <main class="content">

        {% block content %}
        {% endblock %}

    </main>

</div>


<!-- Footer -->
<footer class="footer">
    <p>Machine Learning Dashboard | Flask Application</p>
</footer>


</body>
</html>
